name: Diagnose GitHub-IP

# Einmalige Untersuchung: Welche Shops weisen die GitHub-Runner-IP ab, und was
# behebt es? Vier Arme auf ubuntu-latest, damit der Vergleich sauber ist:
#   direkt      - nackte Runner-IP, httpx (Ausgangslage)
#   warp        - Cloudflare-WARP-Egress (anderer IP-Ruf)
#   cffi-direkt - curl_cffi (Chrome-TLS-Fingerabdruck), Runner-IP
#   cffi-warp   - beides zusammen
# Nur manuell auslösbar.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - methode: direkt
            warp: false
            impersonate: ""
          - methode: warp
            warp: true
            impersonate: ""
          - methode: cffi-direkt
            warp: false
            impersonate: "chrome124"
          - methode: cffi-warp
            warp: true
            impersonate: "chrome124"
    name: ${{ matrix.methode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          pip install -r requirements.txt
          pip install curl_cffi

      - name: Cloudflare WARP einrichten
        if: ${{ matrix.warp }}
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 3
          sudo warp-cli --accept-tos registration new \
            || sudo warp-cli --accept-tos register \
            || sudo warp-cli register || true
          sudo warp-cli --accept-tos connect || sudo warp-cli connect
          sleep 8
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E 'warp=|ip=' || true
          if ! curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
            echo "::error::WARP nicht aktiv (warp=on fehlt) - Diagnose-Arm ungültig."
            exit 1
          fi

      - name: Egress-IP
        run: echo "Egress-IP: $(curl -s https://api.ipify.org)"

      - name: Shops prüfen (${{ matrix.methode }})
        env:
          IMPERSONATE: ${{ matrix.impersonate }}
        run: python tools/diagnose_shops.py
