name: Tägliche Aktualisierung

# Läuft einmal täglich, komplett auf GitHub-Runnern (kein eigener Rechner).
#
# WARUM SHARDING: Acht der 21 Shops weisen die Rechenzentrums-IP ab. Dagegen
# helfen zwei Dinge zusammen - ein anderer Egress (Cloudflare WARP) UND ein
# Chrome-TLS-Fingerabdruck (curl_cffi, IMPERSONATE). Einzeln reicht keines. Aber:
# Auf EINER WARP-IP kippen die schwersten Shopify-Shops (upway, boc24) unter der
# kumulierten Last wieder mit 429. Deshalb läuft der Scrape in mehreren Shards -
# je Shard ein eigener GitHub-Job mit eigener WARP-IP -, sodass keine IP die
# volle Shopify-Last trägt. Im Diagnose-/Test-Workflow gemessen: einzeln auf
# frischer IP kommen alle Shops durch. Der Merge-Job führt die Shards zu einem
# Bericht zusammen und schreibt Preisverlauf + Seite.
#
# Versioniert wird historie/YYYY-MM-DD.jsonl.xz — je Lauftag eine komprimierte,
# danach unveränderliche Datei (~52 KB). preise.db entsteht daraus lokal neu; sie
# täglich zu committen wäre teuer (Git legt jede Version voll ab).

on:
  schedule:
    # 04:00 UTC = 06:00 deutsche Sommerzeit, 05:00 Winterzeit.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      render:
        description: "lucky-bike per Headless-Chromium mitscannen"
        type: boolean
        default: true
      min_discount:
        description: "Mindestrabatt in Prozent"
        type: string
        default: "50"

# Zwei gleichzeitige Läufe würden sich beim Zurückschreiben der Historie
# gegenseitig überschreiben.
concurrency:
  group: taeglich
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  # --- 1) Scrape in Shards, jeder mit eigener WARP-IP ----------------------
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Die fünf Shopify-Shops (upway, boc24, bikemarket24, ebikeonly,
          # fahrradde) sind auf verschiedene Shards verteilt; die schwersten
          # (boc24, upway) stehen allein, damit keine WARP-IP zu viel Shopify
          # trägt. Der Rest ist gleichmäßig aufgeteilt.
          - name: a
            shops: "luckybike boc24 fahrrad24 radfieber"
            render: true
          - name: b
            shops: "fahrradxxl bikeexchange ebikestock"
            render: false
          # upway ist zu gross fuer eine IP (sale + die tiefe "all"-Collection
          # laufen ins 429). Auf drei Sub-Shards mit je eigener WARP-IP verteilt:
          # sale komplett, "all" in zwei Seitenbereichen. Der Merge legt die drei
          # upway-Teile wieder zu einem Shop zusammen.
          - name: upway-sale
            shops: "upway"
            collections: "sale"
            render: false
          # "all" trunkiert je frischer IP bei ~6 Shopify-Abrufen, daher drei
          # Fenster zu je hoechstens 5 Seiten.
          - name: upway-all1
            shops: "upway"
            collections: "all"
            pages: "1-5"
            render: false
          - name: upway-all2
            shops: "upway"
            collections: "all"
            pages: "6-10"
            render: false
          - name: upway-all3
            shops: "upway"
            collections: "all"
            pages: "11-16"
            render: false
          - name: c
            shops: "ebikeonly fahrradde denfeld mhwbike"
            render: false
          - name: d
            shops: "bikemarket24 lagerverkauf radwelt rad1"
            render: false
          - name: e
            shops: "jobradloop bikeangebot nubuk bikediscount bike24"
            render: false
            # Dieser (leichte) Shard holt nebenbei die Bewertungen ALLER Shops,
            # damit das nicht den Merge aufhält - läuft so parallel zu upway.
            ratings: true
    name: scrape-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cloudflare WARP
        # Eigener Egress je Shard. curl_cffi (IMPERSONATE, beim Scrape) allein
        # reicht nicht - erst mit der WARP-IP zusammen nehmen die Shops an.
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 3
          sudo warp-cli --accept-tos registration new \
            || sudo warp-cli --accept-tos register || sudo warp-cli register || true
          sudo warp-cli --accept-tos connect || sudo warp-cli connect
          sleep 8
          echo "Egress: $(curl -s https://api.ipify.org)"
          if ! curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
            echo "::error::Cloudflare WARP nicht aktiv - die Shops würden die Runner-IP abweisen."
            exit 1
          fi

      - name: Playwright (nur Render-Shard)
        if: ${{ matrix.render }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Shard scrapen (${{ matrix.name }})
        env:
          IMPERSONATE: chrome124
        run: |
          RENDER=""
          if [ "${{ matrix.render }}" = "true" ] && [ "${{ inputs.render }}" != "false" ]; then
            RENDER="--render"
          fi
          RATINGS=""
          if [ "${{ matrix.ratings }}" = "true" ]; then
            RATINGS="--ratings-out bewertungen.json"
          fi
          COLL=""
          if [ -n "${{ matrix.collections }}" ]; then
            COLL="--collections ${{ matrix.collections }}"
          fi
          PAGES=""
          if [ -n "${{ matrix.pages }}" ]; then
            PAGES="--pages ${{ matrix.pages }}"
          fi
          python tools/scrape_shard.py ${{ matrix.shops }} \
            --out "shard-${{ matrix.name }}.pkl" \
            --min-discount "${{ inputs.min_discount || '50' }}" \
            --max-pages 8 $RENDER $RATINGS $COLL $PAGES

      - name: Shard-Ergebnis ablegen
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.name }}
          path: shard-${{ matrix.name }}.pkl
          retention-days: 3

      - name: Bewertungen ablegen (nur Ratings-Shard)
        if: ${{ matrix.ratings }}
        uses: actions/upload-artifact@v4
        with:
          name: bewertungen
          path: bewertungen.json
          retention-days: 3

  # --- 2) Shards zusammenführen: Bericht, Preisverlauf, Prüfung ------------
  zusammenfuehren:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      bericht_bereit: ${{ steps.bewerten.outputs.bereit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Shard-Ergebnisse holen
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true

      - name: Bewertungen holen (vom Ratings-Shard)
        # Der frische Cache aus Shard e. Fehlt er (Shard-Fehler), holt der Merge
        # die Bewertungen selbst nach - daher continue-on-error statt Abbruch.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bewertungen
          path: .

      - name: Zusammenführen
        # bewertungen.json ist bereits frisch (aus dem Shard); merge_report.py
        # liest den Cache dann nur noch. Fehlt er, wird best-effort nachgeholt
        # (IMPERSONATE für den Fall, dass doch gefetcht werden muss).
        env:
          IMPERSONATE: chrome124
        run: |
          python tools/merge_report.py shards/*.pkl \
            --out bericht.html --json deals.json \
            --history preise.db --ratings bewertungen.json \
            --min-discount "${{ inputs.min_discount || '50' }}"

      - name: Bericht bewerten
        id: bewerten
        if: always()
        # Eine Untergrenze von 50 Angeboten trennt einen echten Lauf von einer
        # Totalpanne. Ohne diese Schranke könnte eine kaputte Ausgabe eine gute
        # Live-Seite überschreiben.
        run: |
          if [ -s bericht.html ] && [ -s deals.json ]; then
            n=$(python -c "import json;print(len(json.load(open('deals.json',encoding='utf-8'))['offers']))")
          else
            n=0
          fi
          echo "Bericht enthält $n Angebote."
          if [ "$n" -ge 50 ]; then
            echo "bereit=true" >> "$GITHUB_OUTPUT"
          else
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nur $n Angebote - Bericht wird nicht veröffentlicht, die bisherige Seite bleibt stehen."
          fi

      - name: Ergebnis prüfen
        id: check
        # Kein Abbruch: Die Prüfung entscheidet nur, ob heute in die Historie
        # geschrieben wird. Ein Teilausfall soll den Lauf nicht rot färben.
        continue-on-error: true
        run: python ci_check.py

      - name: Preisverlauf zurückschreiben
        if: steps.check.outcome == 'success'
        run: |
          git add historie
          if git diff --cached --quiet -- historie; then
            echo "Keine neue Tagesdatei - nichts zu committen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preisverlauf $(date -u +%Y-%m-%d): $(python -c "import json;print(len(json.load(open('deals.json',encoding='utf-8'))['offers']))") Angebote"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Bericht als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bericht-${{ github.run_number }}
          path: |
            bericht.html
            deals.json
          retention-days: 30
          if-no-files-found: warn

      - name: Prüfergebnis melden
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning::Die Plausibilitätsprüfung ist angeschlagen - die Historie wurde heute nicht fortgeschrieben."

  # --- 3) Als Webseite veröffentlichen ------------------------------------
  veroeffentlichen:
    needs: zusammenfuehren
    if: vars.PUBLISH_PAGES == 'true' && needs.zusammenfuehren.outputs.bericht_bereit == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Bericht holen
        uses: actions/download-artifact@v4
        with:
          name: bericht-${{ github.run_number }}
          path: site

      - name: Als Startseite ablegen
        run: |
          cp site/bericht.html site/index.html
          rm -f site/deals.json
          touch site/.nojekyll

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
