name: Tägliche Aktualisierung

# Läuft einmal täglich, komplett auf GitHub-Runnern (kein eigener Rechner).
#
# WARUM SHARDING: Acht der 21 Shops weisen die Rechenzentrums-IP ab. Dagegen
# helfen zwei Dinge zusammen - ein anderer Egress (Cloudflare WARP) UND ein
# Chrome-TLS-Fingerabdruck (curl_cffi, IMPERSONATE). Einzeln reicht keines. Aber:
# Auf EINER WARP-IP kippen die schwersten Shopify-Shops (upway, boc24) unter der
# kumulierten Last wieder mit 429. Deshalb läuft der Scrape in mehreren Shards -
# je Shard ein eigener GitHub-Job mit eigener WARP-IP -, sodass keine IP die
# volle Shopify-Last trägt. Im Diagnose-/Test-Workflow gemessen: einzeln auf
# frischer IP kommen alle Shops durch. Der Merge-Job führt die Shards zu einem
# Bericht zusammen und schreibt Preisverlauf + Seite.
#
# Versioniert wird historie/YYYY-MM-DD.jsonl.xz — je Lauftag eine komprimierte,
# danach unveränderliche Datei (~52 KB). preise.db entsteht daraus lokal neu; sie
# täglich zu committen wäre teuer (Git legt jede Version voll ab).

on:
  schedule:
    # Zweimal täglich. GitHub-Cron kennt nur UTC:
    #   0 10 UTC = 12:00 deutsche Sommerzeit (Winter 11:00) — Mittagslauf
    #   0 22 UTC = 00:00 deutsche Sommerzeit (Winter 23:00) — Mitternachtslauf
    # Beide erzeugen und veröffentlichen den Bericht. Aber NUR der Mittagslauf
    # schreibt den Tagespreis in die Historie (siehe Schritt "Preisverlauf
    # zurückschreiben"), damit je Tag genau ein Preis (der von 12:00) festliegt.
    - cron: "0 10 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      render:
        description: "lucky-bike per Headless-Chromium mitscannen"
        type: boolean
        default: true
      min_discount:
        description: "Mindestrabatt in Prozent"
        type: string
        default: "30"

# Zwei gleichzeitige Läufe würden sich beim Zurückschreiben der Historie
# gegenseitig überschreiben.
concurrency:
  group: taeglich
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  # --- 1) Scrape: ein Job pro Shop, jeder mit eigener WARP-IP --------------
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # GitHub erlaubt auf öffentlichen Repos ~20 gleichzeitige Jobs. 18 lässt
      # Luft und staffelt die ~28 Shard-Jobs automatisch in Wellen, ohne ein
      # Limit (GitHub oder Shop) zu reissen.
      max-parallel: 18
      matrix:
        # EIN Job pro Shop: Der Job-Name IST der Shop-Key, sodass ein roter Job
        # im Actions-Verlauf sofort zeigt, welcher Shop klemmt. Jeder Shop hat
        # eine eigene WARP-IP, damit sich die Shopify-Shops nicht mehr
        # gegenseitig ins 429 treiben.
        include:
          # Shops, die E-Bike UND Fahrrad in einem Job schaffen (moderates Volumen).
          - shop: fahrrad24
          - shop: bikemarket24
          - shop: radfieber
          - shop: bikeexchange
          - shop: bikeangebot
          - shop: rad1
          - shop: luckybike
            render: true
          - shop: jobradloop
          - shop: denfeld
          - shop: bikediscount
          - shop: bike24
          - shop: ebikeonly
          - shop: mhwbike
          - shop: radwelt
          - shop: nubuk
          - shop: rose             # rosebikes.de - Sale mischt E-Bike + Fahrrad
          - shop: ebikestock
            ratings: true          # dieser leichte Job holt nebenbei alle Bewertungen
          # Grosse Katalog-Shops: getrennter E-Bike- und Fahrrad-Shard mit je
          # eigener WARP-IP. Sonst trägt eine IP die kumulierte Last beider Typen
          # und die Shopify-Shops (fahrradde, boc24) laufen ins 429 (wie upway).
          - name: fahrradde-ebike
            shop: fahrradde
            bike_type: ebike
          - name: fahrradde-fahrrad
            shop: fahrradde
            bike_type: fahrrad
          - name: fahrradxxl-ebike
            shop: fahrradxxl
            bike_type: ebike
          - name: fahrradxxl-fahrrad
            shop: fahrradxxl
            bike_type: fahrrad
          - name: lagerverkauf-ebike
            shop: lagerverkauf
            bike_type: ebike
          - name: lagerverkauf-fahrrad
            shop: lagerverkauf
            bike_type: fahrrad
          - name: boc24-ebike
            shop: boc24
            bike_type: ebike
          - name: boc24-fahrrad
            shop: boc24
            bike_type: fahrrad
          # upway ist E-Bike-only, aber zu gross für eine IP (sale + tiefe
          # "all"-Collection laufen ins 429), daher vier Seitenbereich-Jobs mit
          # je eigener WARP-IP; der Merge legt sie wieder zu einem upway zusammen.
          - name: upway-sale
            shop: upway
            collections: sale
          - name: upway-all1
            shop: upway
            collections: all
            pages: "1-5"
          - name: upway-all2
            shop: upway
            collections: all
            pages: "6-10"
          - name: upway-all3
            shop: upway
            collections: all
            pages: "11-16"
    name: ${{ matrix.name || matrix.shop }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cloudflare WARP
        # Eigener Egress je Shard. curl_cffi (IMPERSONATE, beim Scrape) allein
        # reicht nicht - erst mit der WARP-IP zusammen nehmen die Shops an.
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 3
          sudo warp-cli --accept-tos registration new \
            || sudo warp-cli --accept-tos register || sudo warp-cli register || true
          sudo warp-cli --accept-tos connect || sudo warp-cli connect
          sleep 8
          echo "Egress: $(curl -s https://api.ipify.org)"
          if ! curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
            echo "::error::Cloudflare WARP nicht aktiv - die Shops würden die Runner-IP abweisen."
            exit 1
          fi

      - name: Playwright (nur Render-Shard)
        if: ${{ matrix.render }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: "${{ matrix.name || matrix.shop }} scrapen"
        env:
          IMPERSONATE: chrome124
        run: |
          RENDER=""
          if [ "${{ matrix.render }}" = "true" ] && [ "${{ inputs.render }}" != "false" ]; then
            RENDER="--render"
          fi
          RATINGS=""
          if [ "${{ matrix.ratings }}" = "true" ]; then
            RATINGS="--ratings-out bewertungen.json"
          fi
          COLL=""
          if [ -n "${{ matrix.collections }}" ]; then
            COLL="--collections ${{ matrix.collections }}"
          fi
          PAGES=""
          if [ -n "${{ matrix.pages }}" ]; then
            PAGES="--pages ${{ matrix.pages }}"
          fi
          TYPE=""
          if [ -n "${{ matrix.bike_type }}" ]; then
            TYPE="--bike-type ${{ matrix.bike_type }}"
          fi
          python tools/scrape_shard.py ${{ matrix.shop }} \
            --out "shard-${{ matrix.name || matrix.shop }}.pkl" \
            --min-discount "${{ inputs.min_discount || '30' }}" \
            --max-pages 8 $RENDER $RATINGS $COLL $PAGES $TYPE

      - name: Ergebnis ablegen
        # always(): auch ein rot gewordener Shop hat sein Pickle schon
        # geschrieben (mit dem Fehler drin) - der Merge soll es trotzdem bekommen.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.name || matrix.shop }}
          path: shard-${{ matrix.name || matrix.shop }}.pkl
          if-no-files-found: ignore
          retention-days: 3

      - name: Bewertungen ablegen (nur Ratings-Job)
        if: ${{ always() && matrix.ratings }}
        uses: actions/upload-artifact@v4
        with:
          name: bewertungen
          path: bewertungen.json
          if-no-files-found: ignore
          retention-days: 3

  # --- 2) Shards zusammenführen: Bericht, Preisverlauf, Prüfung ------------
  zusammenfuehren:
    needs: scrape
    # !cancelled(): auch wenn einzelne Shop-Jobs rot sind (ein Shop blockt),
    # soll der Bericht aus den übrigen entstehen - die Fehler-Pickles sind
    # dank always()-Upload trotzdem dabei.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      bericht_bereit: ${{ steps.bewerten.outputs.bereit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Shard-Ergebnisse holen
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true

      - name: Bewertungen holen (vom Ratings-Shard)
        # Der frische Cache aus Shard e. Fehlt er (Shard-Fehler), holt der Merge
        # die Bewertungen selbst nach - daher continue-on-error statt Abbruch.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bewertungen
          path: .

      - name: Zusammenführen
        # bewertungen.json ist bereits frisch (aus dem Shard); merge_report.py
        # liest den Cache dann nur noch. Fehlt er, wird best-effort nachgeholt
        # (IMPERSONATE für den Fall, dass doch gefetcht werden muss).
        env:
          IMPERSONATE: chrome124
        run: |
          python tools/merge_report.py shards/*.pkl \
            --out bericht.html --json deals.json \
            --history preise.db --ratings bewertungen.json \
            --min-discount "${{ inputs.min_discount || '30' }}"

      - name: Bericht bewerten
        id: bewerten
        if: always()
        # Eine Untergrenze von 50 Angeboten trennt einen echten Lauf von einer
        # Totalpanne. Ohne diese Schranke könnte eine kaputte Ausgabe eine gute
        # Live-Seite überschreiben.
        run: |
          if [ -s bericht.html ] && [ -s deals.json ]; then
            n=$(python -c "import json;print(len(json.load(open('deals.json',encoding='utf-8'))['offers']))")
          else
            n=0
          fi
          echo "Bericht enthält $n Angebote."
          if [ "$n" -ge 50 ]; then
            echo "bereit=true" >> "$GITHUB_OUTPUT"
          else
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nur $n Angebote - Bericht wird nicht veröffentlicht, die bisherige Seite bleibt stehen."
          fi

      - name: Ergebnis prüfen
        id: check
        # Kein Abbruch: Die Prüfung entscheidet nur, ob heute in die Historie
        # geschrieben wird. Ein Teilausfall soll den Lauf nicht rot färben.
        continue-on-error: true
        run: python ci_check.py

      - name: Preisverlauf zurückschreiben
        # Nur der Mittagslauf (0 10 UTC) und manuelle Läufe schreiben den
        # Tagespreis fest. Der Mitternachtslauf (0 22) veröffentlicht nur die
        # Seite neu, damit je Tag genau EIN Preis in der Historie steht.
        if: >-
          steps.check.outcome == 'success' &&
          (github.event_name != 'schedule' || github.event.schedule == '0 10 * * *')
        run: |
          git add historie
          if git diff --cached --quiet -- historie; then
            echo "Keine neue Tagesdatei - nichts zu committen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preisverlauf $(date -u +%Y-%m-%d): $(python -c "import json;print(len(json.load(open('deals.json',encoding='utf-8'))['offers']))") Angebote"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Bericht als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bericht-${{ github.run_number }}
          path: |
            bericht.html
            deals.json
          retention-days: 30
          if-no-files-found: warn

      - name: Prüfergebnis melden
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning::Die Plausibilitätsprüfung ist angeschlagen - die Historie wurde heute nicht fortgeschrieben."

  # --- 3) Als Webseite veröffentlichen ------------------------------------
  veroeffentlichen:
    needs: zusammenfuehren
    # Explizit statt implizitem success(): Weil der Merge-Job !cancelled() nutzt,
    # greift die automatische success()-Sperre hier nicht zuverlässig - der
    # Publish wurde sonst übersprungen, obwohl bericht_bereit=true war. Deshalb
    # das Merge-Ergebnis ausdrücklich prüfen.
    if: >-
      ${{ !cancelled()
          && needs.zusammenfuehren.result == 'success'
          && vars.PUBLISH_PAGES == 'true'
          && needs.zusammenfuehren.outputs.bericht_bereit == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Bericht holen
        uses: actions/download-artifact@v4
        with:
          name: bericht-${{ github.run_number }}
          path: site

      - name: Als Startseite ablegen
        run: |
          cp site/bericht.html site/index.html
          rm -f site/deals.json
          touch site/.nojekyll

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
