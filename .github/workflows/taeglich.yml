name: Tägliche Aktualisierung

# Läuft einmal täglich und schreibt den Preisverlauf zurück ins Repository.
#
# Versioniert wird historie/YYYY-MM-DD.jsonl.xz — je Lauftag eine komprimierte,
# danach unveränderliche Datei (~52 KB). preise.db entsteht daraus lokal neu.
# Die SQLite-Datei selbst täglich zu committen wäre naheliegend, aber teuer:
# sie wächst, und Git legt bei jedem Commit eine Kopie der ganzen Datei ab —
# nach einem Jahr mehrere Gigabyte statt rund 23 MB.
#
# Bewusst NICHT actions/cache dafür: GitHub räumt Caches nach 7 Tagen ohne
# Zugriff und unter Speicherdruck ab. Ein stiller Datenverlust wäre genau die
# Fehlerklasse, die der Preisverlauf aufdecken soll.
#
# WO DER LAUF STATTFINDET entscheidet die Repository-Variable RUNNER_LABEL.
# Standard ist ubuntu-latest. Dort weisen allerdings acht der 21 Shops die
# Runner-IP ab (fünf mit 429, drei mit 403) — der Lauf liefert dann rund 940
# statt 1700 Angebote und wird von der Plausibilitätsprüfung verworfen.
# `runner_einrichten.ps1` setzt die Variable auf self-hosted.

on:
  schedule:
    # 04:00 UTC = 06:00 deutsche Sommerzeit, 05:00 Winterzeit.
    # GitHub verschiebt geplante Läufe unter Last, teils um 30+ Minuten.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      render:
        description: "lucky-bike per Headless-Chromium mitscannen"
        type: boolean
        default: true
      min_discount:
        description: "Mindestrabatt in Prozent"
        type: string
        default: "50"

# Zwei gleichzeitige Läufe würden sich beim Zurückschreiben der Historie
# gegenseitig überschreiben.
concurrency:
  group: taeglich
  cancel-in-progress: false

permissions:
  contents: write

# Python schreibt auf einem Windows-Runner sonst in cp1252, das an Umlauten und
# Zeichen wie "→" abbricht. Auf den Linux-Runnern ist UTF-8 ohnehin Vorgabe -
# diese Zeile macht beide gleich. (ci_check.py erzwingt es zusätzlich selbst,
# falls jemand es außerhalb des Workflows aufruft.)
env:
  PYTHONUTF8: "1"

jobs:
  aktualisieren:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120

    # Ob ein veröffentlichbarer Bericht entstanden ist. Bewusst getrennt vom
    # Erfolg der Plausibilitätsprüfung: Ein Teillauf (auf GitHub-IPs blocken
    # acht Shops) liefert einen kleineren, aber gültigen Bericht - der gehört
    # auf die Seite, auch wenn er nicht in die Historie geschrieben wird.
    outputs:
      bericht_bereit: ${{ steps.bewerten.outputs.bereit }}

    defaults:
      run:
        # Auf einem selbst gehosteten Windows-Runner wäre die Vorgabe pwsh.
        # Bash ist dort über Git für Windows vorhanden, und so bleiben die
        # Schritte auf beiden Runner-Arten identisch.
        shell: bash

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        # Nur auf GitHub-Runnern nötig, die mit leerer VM starten. Auf einem
        # selbst gehosteten Rechner ist Python vorhanden - und setup-python ruft
        # intern PowerShell auf, das dort das Nutzerprofil lädt und an einer
        # restriktiven Execution-Policy scheitert. Das System-Python zu nehmen
        # umgeht das, ohne eine Sicherheitseinstellung ändern zu müssen.
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python melden
        run: python --version

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright installieren
        if: inputs.render != false
        run: |
          pip install playwright
          # --with-deps installiert Systempakete und braucht sudo; das gibt es
          # nur auf den GitHub-Runnern. Auf dem eigenen Rechner ist Chromium
          # nach dem ersten Mal ohnehin vorhanden.
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      - name: Angebote abrufen
        id: scrape
        # Ein Teilausfall soll nicht den ganzen Job beenden - was eingesammelt
        # wurde, wird gleich danach auf Plausibilität geprüft.
        continue-on-error: true
        run: |
          python run.py \
            --min-discount "${{ inputs.min_discount || '50' }}" \
            --max-pages 8 \
            ${{ inputs.render != false && '--render' || '' }} \
            --json deals.json \
            --quiet
          echo "--- Zusammenfassung ---"
          python -c "import json;d=json.load(open('deals.json',encoding='utf-8'));print(f\"{len(d['offers'])} Treffer aus {d['total_scanned']} geprueften Angeboten\")"

      - name: Bericht bewerten
        id: bewerten
        if: always()
        # Gibt es einen Bericht, der sich zu veröffentlichen lohnt? Eine
        # Untergrenze von 50 Angeboten trennt einen echten (auch teilweisen)
        # Lauf von einer Totalpanne - der Teillauf auf GitHub-IPs liefert rund
        # 940, ein flächiger Adapter-Ausfall läge im einstelligen Bereich. Ohne
        # diese Schranke könnte eine kaputte Ausgabe eine gute Live-Seite
        # überschreiben.
        run: |
          if [ -s bericht.html ] && [ -s deals.json ]; then
            n=$(python -c "import json;print(len(json.load(open('deals.json',encoding='utf-8'))['offers']))")
          else
            n=0
          fi
          echo "Bericht enthält $n Angebote."
          if [ "$n" -ge 50 ]; then
            echo "bereit=true" >> "$GITHUB_OUTPUT"
          else
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nur $n Angebote - Bericht wird nicht veröffentlicht, die bisherige Seite bleibt stehen."
          fi

      - name: Ergebnis prüfen
        id: check
        # Kein Abbruch des Jobs: Die Prüfung entscheidet nur, ob heute in die
        # Historie geschrieben wird. Ein IP-bedingter Teilausfall soll den Lauf
        # nicht rot färben (das gäbe täglich falschen Alarm), sondern eine
        # sichtbare Warnung setzen.
        continue-on-error: true
        run: python ci_check.py

      - name: Preisverlauf zurückschreiben
        if: steps.check.outcome == 'success'
        run: |
          git add historie
          if git diff --cached --quiet -- historie; then
            echo "Keine neue Tagesdatei - nichts zu committen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preisverlauf $(date -u +%Y-%m-%d): $(python -c "import json;print(len(json.load(open('deals.json',encoding='utf-8'))['offers']))") Angebote"
          # Konkurrierende Commits (etwa ein lokaler Push) sind selten, aber
          # ein Rebase ist billiger als ein fehlgeschlagener Job.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Bericht als Artefakt ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bericht-${{ github.run_number }}
          path: |
            bericht.html
            deals.json
          retention-days: 30
          if-no-files-found: warn

      - name: Arbeitsverzeichnis aufräumen
        if: always()
        # Ein selbst gehosteter Runner behält sein Verzeichnis zwischen den
        # Läufen. Ohne dieses Aufräumen bliebe der erzeugte Bericht liegen und
        # eine spätere Prüfung könnte alte Daten für neue halten.
        run: rm -f bericht.html deals.json

      - name: Prüfergebnis melden
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning::Die Plausibilitätsprüfung ist angeschlagen - die Historie wurde heute nicht fortgeschrieben. Meist heißt das, dass Shops die Runner-IP abweisen. Ein self-hosted Runner (runner_einrichten.ps1) behebt das."

  # Bericht als Webseite unter https://fortuenchen.github.io/ebike-deals/
  # veröffentlichen. Läuft, sobald ein veröffentlichbarer Bericht entstand -
  # auch bei einem Teillauf, denn eine aktuelle Teilansicht ist besser als eine
  # veraltete Seite. Steuerbar über die Repository-Variable PUBLISH_PAGES;
  # ohne sie bleibt alles beim Artefakt-Download.
  veroeffentlichen:
    needs: aktualisieren
    if: vars.PUBLISH_PAGES == 'true' && needs.aktualisieren.outputs.bericht_bereit == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Bericht holen
        uses: actions/download-artifact@v4
        with:
          name: bericht-${{ github.run_number }}
          path: site

      - name: Als Startseite ablegen
        run: |
          cp site/bericht.html site/index.html
          # deals.json nicht mit veröffentlichen - die Seite zeigt den Bericht,
          # nicht die Rohdaten.
          rm -f site/deals.json
          # Verhindert, dass GitHub die Seite durch Jekyll verarbeitet.
          touch site/.nojekyll

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          # Aktiviert GitHub Pages beim ersten Lauf automatisch, sodass man es
          # nicht zusätzlich in den Repository-Einstellungen umlegen muss.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
