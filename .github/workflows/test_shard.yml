name: Test Shard (Shopify isoliert)

# Hypothese fuers Sharding: Kippt ein Shopify-Shop nur wegen der KUMULIERTEN
# Last mehrerer Shops auf einer WARP-IP, dann kommt er allein - auf eigener
# WARP-IP, bei voller Scan-Tiefe - durch. Jeder Shop laeuft hier in einem
# eigenen Job (= eigene WARP-IP). Nur manuell.
on:
  workflow_dispatch:

jobs:
  einzeln:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shop: [upway, ebikeonly, boc24, bikemarket24, fahrradde]
    name: ${{ matrix.shop }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r requirements.txt

      - name: Cloudflare WARP
        run: |
          set -e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc || true
          sleep 3
          sudo warp-cli --accept-tos registration new \
            || sudo warp-cli --accept-tos register || sudo warp-cli register || true
          sudo warp-cli --accept-tos connect || sudo warp-cli connect
          sleep 8
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E 'warp=|ip=' || true
          if ! curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
            echo "::error::WARP nicht aktiv"; exit 1
          fi

      - name: Scrape ${{ matrix.shop }} (volle Tiefe, eigene WARP-IP)
        env:
          IMPERSONATE: chrome124
        run: |
          echo "Egress: $(curl -s https://api.ipify.org)"
          python run.py -s ${{ matrix.shop }} --max-pages 8 --no-history --no-ratings --json out.json -o bericht_tmp.html --quiet || true
          python -c "import json; d=json.load(open('out.json')); s=d['shops'][0]; print('ERGEBNIS', s['key'], '->', len(d['offers']), 'Angebote,', d['total_scanned'], 'geprueft,', (s.get('error') or 'OK'))"
