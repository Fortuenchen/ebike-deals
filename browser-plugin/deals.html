<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preisalarm — alle Deals</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #14161a; --muted: #6b7280; --line: #e5e7eb;
      --card: #f7f8fa; --accent: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14161b; --fg: #e7e9ee; --muted: #9aa1ad; --line: #2a2e37;
              --card: #1c1f26; --accent: #ff6b5e; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif;
           background: var(--bg); color: var(--fg); }
    header { padding: 20px 24px 6px; }
    header h1 { margin: 0; font-size: 20px; }
    .meta { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 14px 24px; position: sticky; top: 0; background: var(--bg);
      border-bottom: 1px solid var(--line); z-index: 5; }
    .controls input[type="search"] { flex: 1 1 260px; }
    .controls input, .controls select { background: var(--card); color: var(--fg);
      border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; font: inherit; }
    .controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    .controls input[type="number"] { width: 66px; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 9px;
      padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px; padding: 18px 24px 40px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column; }
    .card a { text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%; }
    .thumb { position: relative; aspect-ratio: 4/3; background: #0001; }
    .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .badge { position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff;
      font-weight: 800; font-size: 13px; padding: 3px 8px; border-radius: 999px; }
    .type { position: absolute; top: 8px; right: 8px; background: #0009; color: #fff;
      font-size: 10.5px; padding: 2px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
    .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .shop { color: var(--muted); font-size: 11.5px; }
    .ti { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
    .prices { margin-top: auto; display: flex; align-items: baseline; gap: 8px; }
    .now { font-weight: 800; font-size: 16px; }
    .was { color: var(--muted); text-decoration: line-through; font-size: 12.5px; }
    .seen { color: var(--muted); font-size: 11px; }
    .empty { padding: 40px 24px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Preisalarm — alle Neuware-Deals</h1>
    <p class="meta" id="meta">Lade …</p>
  </header>
  <div class="controls">
    <input type="search" id="q" placeholder="Suchen: Marke, Modell, Shop …" autocomplete="off">
    <label>ab <input type="number" id="minpct" min="30" max="95" step="1"> %</label>
    <select id="type">
      <option value="alle">Alle Typen</option>
      <option value="ebike">E-Bike</option>
      <option value="fahrrad">Fahrrad</option>
    </select>
    <select id="sort">
      <option value="discount">Rabatt absteigend</option>
      <option value="price-asc">Preis aufsteigend</option>
      <option value="price-desc">Preis absteigend</option>
    </select>
    <button id="refresh" type="button">Aktualisieren</button>
  </div>
  <main id="grid" class="grid"></main>
  <script src="deals.js"></script>
</body>
</html>
