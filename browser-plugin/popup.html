<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff; --fg: #14161a; --muted: #6b7280; --line: #e5e7eb;
      --card: #f7f8fa; --accent: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181d; --fg: #e7e9ee; --muted: #9aa1ad; --line: #2a2e37;
              --card: #1e2128; --accent: #ff6b5e; }
    }
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; font: 13px/1.45 system-ui, -apple-system, sans-serif;
           background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
    header h1 { font-size: 14px; margin: 0; font-weight: 700; }
    header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
    .settings { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px;
                align-items: center; padding: 8px 14px 12px; border-bottom: 1px solid var(--line); }
    .settings label { display: flex; align-items: center; gap: 7px; }
    .settings input[type="number"] { width: 66px; background: var(--card); color: var(--fg);
      border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; font: inherit; }
    .settings input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); }
    .row-full { grid-column: 1 / -1; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer; }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    .status { padding: 8px 14px; color: var(--muted); font-size: 12px; margin: 0; }
    ul.offers { list-style: none; margin: 0; padding: 0 6px 6px; max-height: 300px; overflow-y: auto; }
    ul.offers li { padding: 8px; border-radius: 8px; }
    ul.offers li:hover { background: var(--card); }
    ul.offers a { text-decoration: none; color: inherit; display: grid;
      grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
    .pct { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums;
      min-width: 44px; text-align: right; }
    .ti { font-weight: 600; }
    .sub { color: var(--muted); font-size: 11.5px; }
    .empty { padding: 16px 14px; color: var(--muted); }
    footer { padding: 8px 14px 12px; border-top: 1px solid var(--line); }
    footer a { color: var(--muted); font-size: 11.5px; }
  </style>
</head>
<body>
  <header><span class="dot"></span><h1>EbikeDeals Preisalarm</h1></header>

  <div class="settings">
    <label><input type="checkbox" id="enabled"> Alarm aktiv</label>
    <button class="ghost" id="checkNow" type="button">Jetzt prüfen</button>
    <label>Mindestrabatt</label>
    <span><input type="number" id="threshold" min="30" max="95" step="1"> %</span>
    <label>Prüfintervall</label>
    <span><input type="number" id="interval" min="15" max="1440" step="15"> min</span>
  </div>

  <p class="status" id="status">…</p>
  <ul class="offers" id="offers"></ul>

  <footer>
    <a id="allDeals" href="#">Alle Preisalarm-Deals →</a>
    <a id="siteLink" href="#" target="_blank" style="float:right">Übersicht</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
